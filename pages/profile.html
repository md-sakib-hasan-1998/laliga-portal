<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — LaLiga Portal</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="navbar-brand">
    <div class="logo-icon">LL</div>
    <span class="brand-text">LA<span>LIGA</span> PORTAL</span>
  </a>
  <ul class="navbar-nav">
    <li><a href="../index.html">Home</a></li>
    <li><a href="scores.html">Scores</a></li>
    <li><a href="standings.html">Standings</a></li>
    <li><a href="clubs.html">Clubs</a></li>
    <li><a href="stats.html">Stats</a></li>
    <li><a href="history.html">History</a></li>
  </ul>
  <div class="navbar-actions">
    <button class="btn btn-ghost btn-sm" id="userBtn">—</button>
    <button class="hamburger" onclick="document.body.classList.toggle('mobile-nav-open')">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="main-content fade-in" id="mainContent">
  <div class="loading-state"><div class="spinner"></div><p>Loading profile…</p></div>
</div>

<script type="module">
import { onUserChange, logOut, changePassword, getCurrentUserData } from '../js/auth.js';

let currentUserData = null;

onUserChange(async (user, userData) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  currentUserData = userData;
  document.getElementById('userBtn').textContent = userData?.name || user.email;
  renderProfile(userData);
});

function renderProfile(userData) {
  const el = document.getElementById('mainContent');
  el.innerHTML = `
    <div style="max-width:600px;margin:0 auto">
      <div class="section-header">
        <h1 class="section-title">MY <span>PROFILE</span></h1>
        <a href="../index.html" class="btn btn-ghost btn-sm">← Back</a>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
            <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--crimson),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:2rem;flex-shrink:0">
              ${(userData.name || '?').charAt(0).toUpperCase()}
            </div>
            <div>
              <h2 style="font-size:2rem">${userData.name}</h2>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px">
                <span class="role-badge ${userData.role}">${userData.role.toUpperCase()}</span>
                <span class="status-badge ${userData.status}">${userData.status.toUpperCase()}</span>
              </div>
            </div>
          </div>
          <div class="grid-2" style="gap:0.75rem">
            ${infoRow('Email', userData.email)}
            ${infoRow('Phone', userData.phone)}
            ${infoRow('Country', userData.country)}
            ${infoRow('Member Since', userData.createdAt?.toDate ? userData.createdAt.toDate().toLocaleDateString() : '—')}
          </div>
        </div>
      </div>

      <!-- Change Password -->
      <div class="card">
        <div class="card-header"><h3 style="font-size:1.5rem">CHANGE <span style="color:var(--gold)">PASSWORD</span></h3></div>
        <div class="card-body">
          <div id="passError" style="background:rgba(224,26,46,0.1);border:1px solid rgba(224,26,46,0.3);color:#ff4d5e;padding:0.75rem 1rem;border-radius:8px;font-size:0.9rem;margin-bottom:1rem;display:none"></div>
          <div id="passSuccess" style="background:rgba(29,185,84,0.1);border:1px solid rgba(29,185,84,0.3);color:var(--green);padding:0.75rem 1rem;border-radius:8px;font-size:0.9rem;margin-bottom:1rem;display:none"></div>
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control" id="currentPass" placeholder="Current password" />
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPass" placeholder="New password (min 8 chars)" />
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPass" placeholder="Repeat new password" />
          </div>
          <div style="display:flex;gap:0.75rem">
            <button onclick="doChangePassword()" class="btn btn-primary" id="changePassBtn">Update Password</button>
            <button onclick="doLogout()" class="btn btn-danger">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function infoRow(label, value) {
  return `
    <div style="padding:0.75rem;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid var(--border)">
      <div style="font-family:'Bebas Neue';font-size:0.75rem;color:var(--grey);letter-spacing:0.08em">${label}</div>
      <div style="margin-top:3px">${value || '—'}</div>
    </div>
  `;
}

window.doChangePassword = async function() {
  const current = document.getElementById('currentPass').value;
  const newP = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  const errEl = document.getElementById('passError');
  const sucEl = document.getElementById('passSuccess');
  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!current || !newP || !confirm) { errEl.textContent = 'Fill all fields.'; errEl.style.display = 'block'; return; }
  if (newP.length < 8) { errEl.textContent = 'New password too short.'; errEl.style.display = 'block'; return; }
  if (newP !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('changePassBtn');
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await changePassword(current, newP);
    sucEl.textContent = 'Password updated successfully!';
    sucEl.style.display = 'block';
    document.getElementById('currentPass').value = '';
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
  } catch(e) {
    errEl.textContent = e.message.includes('wrong-password') ? 'Current password is incorrect.' : e.message;
    errEl.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Update Password';
};

window.doLogout = async function() { await logOut(); };
</script>
</body>
</html>
