<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — LaLiga Portal</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;position:relative;z-index:1}
    .auth-card{background:var(--navy-mid);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .auth-logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--gold);letter-spacing:.1em;text-align:center}
    .auth-sub{color:var(--grey);font-size:.9rem;text-align:center;margin-top:.25rem;margin-bottom:2rem}
    .msg{padding:.75rem 1rem;border-radius:8px;font-size:.9rem;margin-bottom:1rem;display:none}
    .msg.err{background:rgba(224,26,46,.1);border:1px solid rgba(224,26,46,.3);color:#ff4d5e}
    .msg.ok {background:rgba(29,185,84,.1); border:1px solid rgba(29,185,84,.3); color:var(--green)}
    .msg.info{background:rgba(74,173,245,.1);border:1px solid rgba(74,173,245,.3);color:#4aadf5}
    .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--grey);font-size:.8rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .setup-box{background:rgba(245,178,34,.05);border:1px solid rgba(245,178,34,.2);border-radius:10px;padding:1rem;margin-top:1.5rem;font-size:.85rem}
    .setup-box summary{cursor:pointer;color:var(--gold);font-family:'Bebas Neue';letter-spacing:.06em;font-size:.95rem}
    .setup-box p{color:var(--grey);margin:.5rem 0 .75rem}
    code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--white)}
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-logo">LALIGA<br>PORTAL</div>
    <p class="auth-sub">Sign in to your account</p>

    <div id="msg" class="msg"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" id="emailInput" placeholder="your@email.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div style="position:relative">
        <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" autocomplete="current-password"/>
        <button type="button" onclick="togglePass()" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--grey);cursor:pointer;font-size:.8rem">Show</button>
      </div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()" id="loginBtn">SIGN IN</button>

    <div class="divider">or</div>

    <div style="text-align:center">
      <p class="text-grey" style="font-size:.9rem">No account yet?</p>
      <a href="signup.html" class="btn btn-outline mt-1">Create Account</a>
    </div>

    <!-- Admin Setup Helper -->
    <details class="setup-box">
      <summary>⚙️ First time / Admin setup</summary>
      <p>Click the button below to create the admin account (<code>sakibhasn85@gmail.com</code> / <code>Sakib1998!</code>). Only needed once after you set up Firebase.</p>
      <button class="btn btn-gold btn-sm btn-full" onclick="setupAdmin()" id="setupBtn">Create Admin Account</button>
      <div id="setupMsg" class="msg" style="margin-top:.5rem"></div>
    </details>

    <div style="text-align:center;margin-top:1.5rem">
      <a href="../index.html" style="color:var(--grey);font-size:.85rem;text-decoration:none">← Back to Home</a>
    </div>
  </div>
</div>

<script type="module">
import { signIn, initAdmin } from '../js/auth.js';
import { auth } from '../js/firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// If already logged in → redirect
onAuthStateChanged(auth, user => {
  if (user) window.location.href = '../index.html';
});

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg ${type}`;
  el.style.display = 'block';
}

window.togglePass = () => {
  const i = document.getElementById('passwordInput');
  i.type = i.type === 'password' ? 'text' : 'password';
};

window.doLogin = async () => {
  const email    = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const btn      = document.getElementById('loginBtn');
  document.getElementById('msg').style.display = 'none';

  if (!email || !password) { showMsg('msg', 'Please enter your email and password.', 'err'); return; }

  btn.textContent = 'Signing in…';
  btn.disabled = true;

  try {
    const userData = await signIn(email, password);
    showMsg('msg', `Welcome back, ${userData.name}! Redirecting…`, 'ok');
    setTimeout(() => {
      window.location.href = (userData.role === 'admin' || userData.role === 'moderator')
        ? 'admin.html' : '../index.html';
    }, 900);
  } catch (e) {
    let msg = e.message;
    if (msg.includes('invalid-credential') || msg.includes('wrong-password') || msg.includes('user-not-found'))
      msg = 'Incorrect email or password. Check your details and try again.';
    if (msg.includes('too-many-requests'))
      msg = 'Too many failed attempts. Please wait a few minutes.';
    showMsg('msg', msg, 'err');
    btn.textContent = 'SIGN IN';
    btn.disabled = false;
  }
};

window.setupAdmin = async () => {
  const btn = document.getElementById('setupBtn');
  const msgEl = document.getElementById('setupMsg');
  btn.textContent = 'Setting up…';
  btn.disabled = true;
  msgEl.style.display = 'none';
  try {
    await initAdmin();
    showMsg('setupMsg', '✓ Admin account ready! You can now sign in with sakibhasn85@gmail.com / Sakib1998!', 'ok');
  } catch (e) {
    showMsg('setupMsg', 'Error: ' + e.message + ' — Make sure your Firebase config is filled in correctly in js/firebase-config.js', 'err');
  }
  btn.textContent = 'Create Admin Account';
  btn.disabled = false;
};

// Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
