<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup Checker — LaLiga Portal</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .setup-page{max-width:700px;margin:80px auto;padding:2rem;position:relative;z-index:1}
    .check-item{display:flex;align-items:flex-start;gap:1rem;padding:1rem 1.25rem;border-radius:10px;margin-bottom:.75rem;border:1px solid var(--border);background:var(--card-bg)}
    .check-icon{font-size:1.4rem;margin-top:2px;flex-shrink:0}
    .check-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.06em}
    .check-detail{font-size:.85rem;color:var(--grey);margin-top:3px;word-break:break-all}
    .check-item.pass{border-color:rgba(29,185,84,.4);background:rgba(29,185,84,.05)}
    .check-item.fail{border-color:rgba(224,26,46,.4);background:rgba(224,26,46,.05)}
    .check-item.warn{border-color:rgba(245,178,34,.4);background:rgba(245,178,34,.05)}
    .check-item.pending{opacity:.6}
    code{background:rgba(255,255,255,.07);padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.8rem}
    .instruction{background:rgba(245,178,34,.06);border:1px solid rgba(245,178,34,.2);border-radius:10px;padding:1rem 1.25rem;margin-top:.5rem;font-size:.85rem;color:var(--grey-light)}
    .instruction b{color:var(--gold)}
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="logo-icon">LL</div>
    <span class="brand-text">LA<span>LIGA</span> PORTAL</span>
  </a>
</nav>

<div class="setup-page fade-in">
  <h1 class="section-title mb-1">SETUP <span>CHECKER</span></h1>
  <p class="text-grey mb-4">This page checks that your Firebase and Football Data API are configured correctly.</p>

  <div id="checks"></div>

  <div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap">
    <button onclick="runChecks()" class="btn btn-primary">↻ Run Checks Again</button>
    <a href="pages/login.html" class="btn btn-outline">Go to Login →</a>
    <a href="index.html" class="btn btn-ghost">← Home</a>
  </div>
</div>

<script type="module">
import { auth, db } from './js/firebase-config.js';
import { initAdmin } from './js/auth.js';
import { getStandings } from './js/api.js';
import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container = document.getElementById('checks');

function addCheck(id, title, detail = '', status = 'pending') {
  const icons = { pass:'✅', fail:'❌', warn:'⚠️', pending:'⏳' };
  let el = document.getElementById('chk-' + id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'chk-' + id;
    container.appendChild(el);
  }
  el.className = `check-item ${status}`;
  el.innerHTML = `
    <div class="check-icon">${icons[status]}</div>
    <div>
      <div class="check-title">${title}</div>
      ${detail ? `<div class="check-detail">${detail}</div>` : ''}
    </div>
  `;
}

function addInstruction(html) {
  const el = document.createElement('div');
  el.className = 'instruction';
  el.innerHTML = html;
  container.appendChild(el);
}

window.runChecks = async function() {
  container.innerHTML = '';

  // ── CHECK 1: Firebase config ──────────────────────────────
  addCheck('fb-config', 'Firebase Config', 'Checking…', 'pending');
  const apiKey = auth.app.options.apiKey;
  if (!apiKey || apiKey.includes('PASTE') || apiKey.includes('YOUR')) {
    addCheck('fb-config', 'Firebase Config — NOT SET', 'The apiKey in js/firebase-config.js still has a placeholder value.', 'fail');
    addInstruction(`<b>How to fix:</b> Open <code>js/firebase-config.js</code> and replace all <code>PASTE_YOUR_...</code> values with your real Firebase project config.<br><br>Get them from: <b>Firebase Console → Project Settings → Your Apps → Web App</b>`);
    return; // No point running other checks
  }
  addCheck('fb-config', 'Firebase Config', `Project: ${auth.app.options.projectId}`, 'pass');

  // ── CHECK 2: Firestore connection ──────────────────────────
  addCheck('firestore', 'Firestore Database', 'Connecting…', 'pending');
  try {
    await getDoc(doc(db, 'settings', 'liveMatch'));
    addCheck('firestore', 'Firestore Database', 'Connected successfully.', 'pass');
  } catch (e) {
    addCheck('firestore', 'Firestore Database — ERROR', e.message, 'fail');
    addInstruction(`<b>How to fix:</b><br>
      1. Go to <b>Firebase Console → Firestore Database</b><br>
      2. Make sure the database is created (click "Create database" if it shows that option)<br>
      3. Go to the <b>Rules</b> tab and paste the rules from <code>firestore.rules</code><br>
      4. Click <b>Publish</b>`);
  }

  // ── CHECK 3: Admin account ─────────────────────────────────
  addCheck('admin', 'Admin Account', 'Checking…', 'pending');
  try {
    const cred = await signInWithEmailAndPassword(auth, 'sakibhasn85@gmail.com', 'Sakib1998!');
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    await signOut(auth);
    if (snap.exists() && snap.data().role === 'admin') {
      addCheck('admin', 'Admin Account', 'Admin account exists and is set up correctly.', 'pass');
    } else {
      addCheck('admin', 'Admin Account — Missing Firestore Doc', 'Auth exists but Firestore user doc missing. Click button below.', 'warn');
      addInstruction(`<b>How to fix:</b> Go to <a href="pages/login.html" style="color:var(--gold)">the login page</a> and click <b>"Create Admin Account"</b> under the setup section.`);
    }
  } catch (e) {
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found') {
      addCheck('admin', 'Admin Account — Does Not Exist Yet', 'Needs to be created.', 'warn');
      addInstruction(`<b>How to fix:</b> Go to <a href="pages/login.html" style="color:var(--gold)">the login page</a> and click <b>"Create Admin Account"</b> under the setup section at the bottom.`);
    } else {
      addCheck('admin', 'Admin Account — Error', e.message, 'fail');
    }
  }

  // ── CHECK 4: Football Data API ─────────────────────────────
  addCheck('api', 'Football Data API Key', 'Fetching…', 'pending');
  try {
    const standings = await getStandings();
    if (standings && standings.length > 0) {
      addCheck('api', 'Football Data API Key', `✓ Working — ${standings.length} teams loaded from La Liga.`, 'pass');
    } else {
      addCheck('api', 'Football Data API Key — No Data', 'API responded but returned no data.', 'warn');
    }
  } catch (e) {
    if (e.message.includes('PASTE') || e.message.includes('YOUR') || e.message.includes('403') || e.message.includes('401')) {
      addCheck('api', 'Football Data API Key — NOT SET / Invalid', e.message, 'fail');
      addInstruction(`<b>How to fix:</b><br>
        1. Register for a free key at <b>https://www.football-data.org/client/register</b><br>
        2. Open <code>js/api.js</code><br>
        3. Replace <code>PASTE_YOUR_FOOTBALL_DATA_API_KEY_HERE</code> with your actual key<br>
        4. Save and re-upload the file to GitHub`);
    } else {
      addCheck('api', 'Football Data API — Error', e.message, 'fail');
    }
  }

  // ── Summary ────────────────────────────────────────────────
  const passes = container.querySelectorAll('.check-item.pass').length;
  const fails  = container.querySelectorAll('.check-item.fail').length;
  const warns  = container.querySelectorAll('.check-item.warn').length;
  const total  = 4;

  const summaryEl = document.createElement('div');
  summaryEl.style.cssText = 'margin-top:1.5rem;padding:1rem 1.25rem;border-radius:10px;text-align:center;font-family:Bebas Neue,sans-serif;font-size:1.2rem;letter-spacing:.06em';
  if (fails === 0 && warns === 0) {
    summaryEl.style.background = 'rgba(29,185,84,.1)';
    summaryEl.style.border = '1px solid rgba(29,185,84,.3)';
    summaryEl.style.color = 'var(--green)';
    summaryEl.textContent = `🎉 All ${total} checks passed! Your site is fully set up.`;
  } else if (fails > 0) {
    summaryEl.style.background = 'rgba(224,26,46,.08)';
    summaryEl.style.border = '1px solid rgba(224,26,46,.3)';
    summaryEl.style.color = '#ff4d5e';
    summaryEl.textContent = `${fails} check(s) failed — follow the instructions above.`;
  } else {
    summaryEl.style.background = 'rgba(245,178,34,.08)';
    summaryEl.style.border = '1px solid rgba(245,178,34,.3)';
    summaryEl.style.color = 'var(--gold)';
    summaryEl.textContent = `${passes} passed, ${warns} warning(s) — almost there!`;
  }
  container.appendChild(summaryEl);
};

runChecks();
</script>
</body>
</html>
